<html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birthday Surprise</title>
  <style>
    body {
      background-color: #fff0f5;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 80px 20px;
      overflow: hidden;
      position: relative;
    }

    h1 {
      color: #d63384;
      font-size: 32px;
    }

    .gift-box {
      margin: 40px auto;
      width: 180px;
      height: 180px;
      background-color: #ff69b4;
      color: white;
      font-size: 20px;
      line-height: 180px;
      cursor: pointer;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    .message {
      display: none;
      font-size: 22px;
      background: #ffe4e1;
      padding: 25px;
      border: 2px dashed #d63384;
      border-radius: 15px;
      max-width: 600px;
      margin: 30px auto;
      z-index: 2;
      position: relative;
    }

    .balloon, .heart {
      position: absolute;
      opacity: 0.85;
      z-index: 0;
    }

    .balloon {
      width: 40px;
      height: 60px;
      border-radius: 50% 50% 50% 50%;
      animation: fly 6s linear infinite;
    }

    .heart {
      width: 20px;
      height: 20px;
      background-color: red;
      transform: rotate(45deg);
      animation: floatHeart 8s linear infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      width: 20px;
      height: 20px;
      background-color: inherit;
      border-radius: 50%;
      position: absolute;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes fly {
      0% {
        bottom: -100px;
        transform: translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        bottom: 110%;
        transform: translateX(-50px);
        opacity: 0;
      }
    }

    @keyframes floatHeart {
      0% {
        bottom: -20px;
        transform: translateX(0) rotate(45deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        bottom: 110%;
        transform: translateX(-30px) rotate(45deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>🎉 Happy Birthday Tanzila! 🎉</h1>
  <div class="gift-box" onclick="showMessage()">🎁 Click Me!</div>

  <div class="message" id="messageBox">
    💖 <strong>HAPPY BIRTHDAY TO YOU TEACHER TANZILA!</strong> 💖<br><br>
    Wishing you joy, peace, and all the love you deserve. Grateful for 4 May forever! 🎈🎂
  </div>

  <audio id="bday-audio" autoplay>
    <source src="https://emicodes90.github.io/english-surprise/happy-birthday-322777.ogg" type="audio/ogg">
    Your browser does not support the audio tag.
  </audio>

  <script>
    const audio = document.getElementById("bday-audio");
    const messageBox = document.getElementById("messageBox");

    function showMessage() {
      messageBox.style.display = "block";
      releaseBalloons();
      releaseHearts();
      audio.play().catch(e => {
        alert("Audio failed to play. Tap to allow it!");
      });
    }

    function releaseBalloons() {
      const colors = ["#ff0000", "#ffa500", "#ffff00", "#008000", "#00ced1", "#1e90ff", "#ff69b4"];
      for (let i = 0; i < 30; i++) {
        const b = document.createElement("div");
        b.className = "balloon";
        b.style.left = Math.random() * 100 + "vw";
        b.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        b.style.animationDuration = 4 + Math.random() * 3 + "s";
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 8000);
      }
    }

    function releaseHearts() {
      const colors = ["#ff1493", "#ff0000", "#800080"];
      setInterval(() => {
        const h = document.createElement("div");
        h.className = "heart";
        h.style.left = Math.random() * 100 + "vw";
        h.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        h.style.animationDuration = 6 + Math.random() * 3 + "s";
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 10000);
      }, 400);
    }
  </script>
</body>
</html>
